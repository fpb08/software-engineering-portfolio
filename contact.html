<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Software Engineering Portfolio</a>
      <nav class="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>

          <li><a href="projects.html">Projects</a></li>

          <li><a aria-current="page" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main-content" class="container page-content">
    <header class="page-heading">
      <p class="eyebrow">Get in touch</p>
      <h1>Contact</h1>
      <p>My Email</p>
      <a href="mailto:fpbburrows08@gmail.com">fpbburrows08@gmail.com</a> <br>
      <p>My Phone Number</p>
      <a href="tel:7542517259">754-251-7259</a>
    </header>
    <section class="content-section" aria-labelledby="contact-heading">
      <h2 id="contact-heading"> Get in Contact with Me</h2>

      <form>

        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        
        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        
        <label for="phone">Your Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br>
        
        <label for="subject">Subject:</label>
        <select id="subject" name="subject">
          <option value="general">General Question</option>
          <option value="projects">Projects</option>
          <option value="other">Other</option>
        </select>
        <br>

        <label for="message">Type your message here:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <br>

        <input type="submit" value="Send Message">
        <input type="reset" value="Reset">
        
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container"><p>Software Engineering Portfolio. Fredrick Burrows 2026</p></div>
  </footer>
